    <!-- Structured data.
         The id matters: Seo.jsx owns the node with this id and rewrites it
         from config on every route change. Giving the static block the same
         id means a crawler that does not run JS still sees a valid Person,
         and a browser that does sees exactly one node — never two
         conflicting Person schemas. -->
    <script type="application/ld+json" id="ld-json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Tesfatseyon Merkinh",
        "url": "https://tesfatseyon.dev",
        "image": "https://tesfatseyon.dev/og.jpg",
        "jobTitle": "Full-Stack Developer and Video Editor",
        "email": "mailto:tesfatseyon16@gmail.com",
        "telephone": "+251983708869",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Wolaita-Sodo",
          "addressCountry": "ET"
        },
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "Dilla University"
        },
        "knowsAbout": [
          "React", "Next.js", "TypeScript", "Python", "Tailwind CSS",
          "Node.js", "UI/UX Design", "SEO", "CapCut", "DaVinci Resolve",
          "Color Grading"
        ],
        "sameAs": [
          "https://github.com/Tesfazion",
          "https://www.linkedin.com/in/tesfatseyon-merkinh-becho-a38626402",
          "https://x.com/tesfatseyo35302",
          "https://www.instagram.com/nani161669/",
          "https://t.me/Zizo1616"
        ]
      }
    </script>

    <!-- Fonts: Instrument Serif (display), Inter (body), JetBrains Mono (labels).
         Display + mono are imported with only the weights the UI needs.
         No rel=preload here on purpose: preloading a stylesheet as
         "style" does not get the font files discovered any sooner, and it
         competes with the CSS and JS for the same connection budget. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
