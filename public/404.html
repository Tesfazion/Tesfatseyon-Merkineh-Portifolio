<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Tesfatseyon Merkinh</title>
  <meta name="description" content="That page does not exist. Head back to the homepage or pick a service." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="canonical" href="https://tesfatseyon.dev/404" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0b;
      --ink: #f5f4f2;
      --ink-2: #a4a3aa;
      --ink-3: #6e6d76;
      --hairline-2: rgba(245, 244, 242, 0.2);
      --accent: #ff4d00;
      --font-display: "Instrument Serif", Georgia, "Times New Roman", serif;
      --font-body: Inter, system-ui, -apple-system, sans-serif;
      --ease: cubic-bezier(0.33, 1, 0.68, 1);
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--ink);
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 24px 64px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    /* Same ambient wash as the app, so the fallback page still feels branded */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 1000px 700px at 82% -12%, rgb(255 77 0 / 0.13), transparent 60%);
    }

    main { position: relative; z-index: 1; max-width: 34rem; }

    .code {
      font-family: var(--font-display);
      font-style: italic;
      font-size: clamp(6rem, 24vw, 12rem);
      line-height: 1;
      color: var(--accent);
      margin-bottom: 8px;
    }

    h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.6rem, 4vw, 2.4rem); margin-bottom: 12px; }
    p  { color: var(--ink-2); margin-bottom: 32px; }
    a  { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 600; font-size: 0.9rem; padding: 12px 22px; border-radius: 7px; transition: transform .26s var(--ease), box-shadow .26s var(--ease), border-color .26s var(--ease), color .26s var(--ease); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .btn-primary { background: var(--accent); color: #0a0a0b; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 28px rgb(255 77 0 / 0.3); }

    .btn-ghost { border: 1px solid var(--hairline-2); color: var(--ink-2); }
    .btn-ghost:hover { color: var(--ink); border-color: var(--accent); transform: translateY(-1px); }

    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }

    .hint { margin-top: 40px; font-size: 0.8rem; color: var(--ink-3); }
    .hint a { display: inline; padding: 0; border-bottom: 1px solid rgb(255 77 0 / 0.42); color: var(--accent); font-size: inherit; }
    .hint a:hover { color: var(--ink); }
  </style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <h1>This page does not exist</h1>
    <p>The link may be out of date, or the address might have a typo.</p>

    <div class="actions">
      <a class="btn-primary" href="/">&larr; Back to home</a>
      <a class="btn-ghost" href="/web">Web Developer</a>
      <a class="btn-ghost" href="/video">Video Editor</a>
      <a class="btn-ghost" href="/blog">Blog</a>
    </div>

    <p class="hint">If you followed a link from somewhere, please let me know — <a href="mailto:tesfatseyon16@gmail.com">email me</a>.</p>
  </main>
</body>
</html>
